# =============================================================================
# Order Service — Service (ClusterIP)
# Selector chỉ dùng `app: order-service` (không có `track`) → traffic chia cho cả
# pod stable và pod canary theo tỉ lệ số replica (xem deployment-strategy.md).
# Chỉ pod Ready (readiness probe pass) mới nằm trong endpoints.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

