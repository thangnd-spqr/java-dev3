# =============================================================================
# Order Service — Secret (EXAMPLE / TEMPLATE ONLY)
#
# ⚠ File này chỉ để học. Giá trị là placeholder, KHÔNG phải credential thật.
# ⚠ Secret của Kubernetes mặc định chỉ base64 (KHÔNG phải mã hoá) → không commit
#   secret thật vào Git, kể cả private repo.
#
# Production: dùng External Secrets Operator / Vault / Sealed Secrets / cloud
# secret manager để sinh Secret `order-service-secret` lúc deploy; bật
# encryption-at-rest cho etcd và RBAC hạn chế quyền `get secrets`.
#
# Tạo secret thủ công (không qua Git):
#   kubectl create secret generic order-service-secret \
#     --from-literal=DB_USERNAME=order_app \
#     --from-literal=DB_PASSWORD="$(vault kv get -field=password secret/order/db)"
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  labels:
    app: order-service
type: Opaque
stringData:
  DB_USERNAME: order_app
  DB_PASSWORD: CHANGE_ME_FROM_SECRET_MANAGER
  SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="order-service" password="CHANGE_ME_FROM_SECRET_MANAGER";
  PAYMENT_API_KEY: CHANGE_ME_FROM_SECRET_MANAGER
  JWT_PUBLIC_KEY_PEM: CHANGE_ME_FROM_SECRET_MANAGER

