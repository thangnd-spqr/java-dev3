spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# ============================================================
# Resilience4j Configuration
# ============================================================
resilience4j:
  # --- Circuit Breaker ---
  circuitbreaker:
    instances:
      paymentService:
        # Failure threshold: mở CB khi >= 50% request fail
        failure-rate-threshold: 50
        # Số request tối thiểu trước khi CB tính failure rate
        minimum-number-of-calls: 5
        # Số request được phép thử trong trạng thái HALF-OPEN
        permitted-number-of-calls-in-half-open-state: 3
        # Thời gian chờ ở trạng thái OPEN trước khi chuyển HALF-OPEN: 30s
        wait-duration-in-open-state: 30s
        # Sliding window type: COUNT_BASED hoặc TIME_BASED
        sliding-window-type: COUNT_BASED
        # Kích thước sliding window
        sliding-window-size: 10
        # Tự động chuyển HALF-OPEN sau khi timeout
        automatic-transition-from-open-to-half-open-enabled: true

  # --- Retry ---
  retry:
    instances:
      paymentService:
        # Số lần thử lại tối đa (bao gồm lần đầu)
        max-attempts: 3
        # Thời gian chờ giữa các lần retry: 1s
        wait-duration: 1s
        # Chỉ retry khi gặp những exception này
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
          - com.example.orderservice.adapter.out.payment.PaymentTransientException
\n